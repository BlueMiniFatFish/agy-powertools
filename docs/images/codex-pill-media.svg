<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect width="1200" height="480" rx="16" fill="#101113"/>

  <!-- Left Card: Unified Horizontal Action Pill -->
  <g transform="translate(24,24)">
    <rect width="564" height="432" rx="14" fill="#181818" stroke="#383838"/>
    <rect x="24" y="20" width="214" height="26" rx="13" fill="#173E76"/>
    <text x="131" y="37" text-anchor="middle" class="font" font-size="12" font-weight="600" fill="#F6FAFE">三路交互统一：Codex 横向胶囊</text>

    <!-- Scenario 1: Text selection / right-click -->
    <rect x="28" y="66" width="508" height="160" rx="12" fill="#212121" stroke="#303030"/>
    <text x="46" y="92" class="font" font-size="12" fill="#A5A5A5">1. 左键划词 或 选中文本右键</text>
    <!-- Highlighted text -->
    <rect x="148" y="158" width="218" height="30" rx="4" fill="#224982"/>
    <text x="257" y="178" text-anchor="middle" class="mono" font-size="14" fill="#FFFFFF">const maxWidth = '48rem'</text>
    <!-- Floating Codex Action Pill -->
    <g transform="translate(152,114)">
      <rect width="224" height="30" rx="10" fill="#2D2D2D" stroke="#3D3D3D"/>
      <text x="48" y="20" text-anchor="middle" class="font" font-size="13" fill="#F5F5F5">添加到对话</text>
      <line x1="96" y1="1" x2="96" y2="29" stroke="#3F3F3F"/>
      <text x="160" y="20" text-anchor="middle" class="font" font-size="13" fill="#F5F5F5">在侧边聊天中提问</text>
    </g>

    <!-- Scenario 2: File / Image right-click -->
    <rect x="28" y="244" width="508" height="162" rx="12" fill="#212121" stroke="#303030"/>
    <text x="46" y="270" class="font" font-size="12" fill="#A5A5A5">2. 右键对话文件、目录、图片或文件树</text>
    <!-- File chip & Image thumb triggers -->
    <rect x="46" y="292" width="110" height="28" rx="14" fill="#2A2A2A" stroke="#3D3D3D"/>
    <text x="101" y="310" text-anchor="middle" class="mono" font-size="12" fill="#63A8F8">@native-ui.js</text>
    <rect x="170" y="290" width="66" height="44" rx="8" fill="#2D3748" stroke="#3D3D3D"/>
    <text x="203" y="317" text-anchor="middle" class="font" font-size="11.5" fill="#CBD5E1">图片预览</text>
    <!-- Floating Codex Action Pill -->
    <g transform="translate(138,348)">
      <rect width="224" height="30" rx="10" fill="#2D2D2D" stroke="#3D3D3D"/>
      <text x="48" y="20" text-anchor="middle" class="font" font-size="13" fill="#F5F5F5">添加到对话</text>
      <line x1="96" y1="1" x2="96" y2="29" stroke="#3F3F3F"/>
      <text x="160" y="20" text-anchor="middle" class="font" font-size="13" fill="#F5F5F5">在侧边聊天中提问</text>
    </g>
  </g>

  <!-- Right Card: 122x122 Composer Media & 3 MiB HD Images -->
  <g transform="translate(612,24)">
    <rect width="564" height="432" rx="14" fill="#181818" stroke="#383838"/>
    <rect x="24" y="20" width="234" height="26" rx="13" fill="#1F3A2E"/>
    <text x="141" y="37" text-anchor="middle" class="font" font-size="12" font-weight="600" fill="#86EFAC">122×122 高清大图 &amp; 3 MiB 无损直传</text>

    <!-- Composer Card expanded cleanly by thumbnails -->
    <g transform="translate(28,74)">
      <rect width="508" height="252" rx="18" fill="#212121" stroke="#383838"/>
      <!-- Two 122x122 rounded image preview cards -->
      <g transform="translate(18,18)">
        <rect width="122" height="122" rx="12" fill="#243247" stroke="rgba(255,255,255,0.16)"/>
        <rect x="14" y="20" width="94" height="58" rx="6" fill="#182232"/>
        <text x="61" y="48" text-anchor="middle" class="mono" font-size="10.5" fill="#63A8F8">design.png</text>
        <text x="61" y="64" text-anchor="middle" class="font" font-size="10" fill="#A5A5A5">2.4 MiB 原图</text>
        <text x="61" y="103" text-anchor="middle" class="font" font-size="11" fill="#E5E7EB">122×122 预览</text>
        <!-- Inverted circular X remove button -->
        <circle cx="117" cy="5" r="10" fill="#FFFFFF" stroke="#212121" stroke-width="2"/>
        <text x="117" y="9" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#181818">×</text>
      </g>
      <g transform="translate(150,18)">
        <rect width="122" height="122" rx="12" fill="#23372E" stroke="rgba(255,255,255,0.16)"/>
        <rect x="14" y="20" width="94" height="58" rx="6" fill="#16241E"/>
        <text x="61" y="48" text-anchor="middle" class="mono" font-size="10.5" fill="#86EFAC">code-shot.png</text>
        <text x="61" y="64" text-anchor="middle" class="font" font-size="10" fill="#A5A5A5">清晰无糊边</text>
        <text x="61" y="103" text-anchor="middle" class="font" font-size="11" fill="#E5E7EB">悬停快捷移除</text>
        <circle cx="117" cy="5" r="10" fill="#FFFFFF" stroke="#212121" stroke-width="2"/>
        <text x="117" y="9" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#181818">×</text>
      </g>

      <!-- Input prompt area & send pill -->
      <line x1="18" y1="158" x2="490" y2="158" stroke="#2E2E2E"/>
      <text x="20" y="188" class="font" font-size="13.5" fill="#A5A5A5">输入消息，@ 引用，/ 选择操作</text>
      <rect x="434" y="204" width="56" height="28" rx="14" fill="#3A83F7"/>
      <text x="462" y="223" text-anchor="middle" class="font" font-size="12.5" font-weight="600" fill="#FFFFFF">发送</text>
    </g>

    <!-- Bottom highlights -->
    <rect x="28" y="346" width="508" height="60" rx="10" fill="#212121" stroke="#303030"/>
    <text x="46" y="371" class="font" font-size="12.5" fill="#FFFFFF">突破原生 1 MiB 强压限制与 10 KiB 缩略图糊图</text>
    <text x="46" y="393" class="font" font-size="12" fill="#A5A5A5">3 MiB 内原图无损直传，缩略图同步提清至 160 KiB Retina 清晰度</text>
  </g>
</svg>